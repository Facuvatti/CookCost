<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookCost</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <h1 style="font-size: 50px;" class="text-center font-bold text-green-600 mb-8">CookCost</h1>
    
    <div class="container max-w-4xl mx-auto mb-8">
        <div class="title bg-white rounded-lg shadow-md p-6 mb-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">INGREDIENTES</h1>
                <button class="add_ingredient add bg-green-500 hover:bg-green-600 text-white font-bold text-2xl w-12 h-12 rounded-full transition-colors duration-200 shadow-md">+</button>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-md p-6">
            <table id="ingredients" class="w-full table-auto"></table>
        </div>
    </div>
    
    <div class="container max-w-4xl mx-auto" id="recipes">
        <div class="title bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">RECETAS</h1>
                <button class="add_recipe add bg-green-500 hover:bg-green-600 text-white font-bold text-2xl w-12 h-12 rounded-full transition-colors duration-200 shadow-md">+</button>
            </div>
        </div>
    </div>
</body>
<script type="module" src="main.js"></script>

</html>
